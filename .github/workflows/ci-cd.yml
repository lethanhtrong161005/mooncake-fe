name: Mooncake Frontend - Staging CI

on:
  push:
    branches:
      - stg
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mooncake-frontend-stg
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: mooncake-fe

jobs:
  build-and-push:
    name: Build and Push Frontend to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '065636180854'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Docker image tag
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$SHA" \
            >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL=/api \
            -t "$IMAGE_URI" \
            .

      - name: Push Docker image to ECR
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: docker push "$IMAGE_URI"

      - name: Deployment summary
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          echo "### Frontend Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`stg\`" >> "$GITHUB_STEP_SUMMARY"
