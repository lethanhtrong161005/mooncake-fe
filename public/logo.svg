<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="npBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c1524" />
      <stop offset="50%" stop-color="#690a16" />
      <stop offset="100%" stop-color="#3d030a" />
    </linearGradient>
    <linearGradient id="npGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe58f" />
      <stop offset="50%" stop-color="#f5c840" />
      <stop offset="100%" stop-color="#d48806" />
    </linearGradient>
    <linearGradient id="npGoldSoft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#faad14" />
      <stop offset="100%" stop-color="#fff1b8" />
    </linearGradient>
    <filter id="npShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3d030a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Luxury Shield -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#npBg)" stroke="url(#npGold)" stroke-width="2.5" filter="url(#npShadow)" />

  <!-- Outer Celestial Ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#npGold)" stroke-width="1.2" stroke-dasharray="4 2.5" opacity="0.65" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#npGold)" stroke-width="0.8" opacity="0.4" />

  <!-- Lotus & Moon Emblem -->
  <g fill="url(#npGold)">
    <!-- Central Main Petal -->
    <path d="M50 24 C44 35 43 49 50 57 C57 49 56 35 50 24 Z" fill="url(#npGoldSoft)" />
    <!-- Left Inner Petal -->
    <path d="M50 57 C40 55 29 43 33 32 C38 42 45 50 50 57 Z" />
    <!-- Right Inner Petal -->
    <path d="M50 57 C60 55 71 43 67 32 C62 42 55 50 50 57 Z" />
    <!-- Left Outer Leaf -->
    <path d="M50 57 C33 59 23 51 21 42 C27 50 39 55 50 57 Z" opacity="0.85" />
    <!-- Right Outer Leaf -->
    <path d="M50 57 C67 59 77 51 79 42 C73 50 61 55 50 57 Z" opacity="0.85" />
    <!-- Lotus Pedestal -->
    <path d="M28 61 Q50 68 72 61 Q50 75 28 61 Z" fill="url(#npGoldSoft)" />
    <!-- Wave Reflection Base -->
    <path d="M35 68 Q50 73 65 68 Q50 79 35 68 Z" opacity="0.65" />
    <!-- Full Moon Jewel Pearl -->
    <circle cx="50" cy="18" r="3" fill="url(#npGoldSoft)" />
    <!-- Stars -->
    <circle cx="26" cy="25" r="1.3" fill="#ffe58f" opacity="0.8" />
    <circle cx="74" cy="25" r="1.3" fill="#ffe58f" opacity="0.8" />
  </g>
</svg>
